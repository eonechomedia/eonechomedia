name: Deploy to GitHub Pages

on:
  push:
    branches: [release-prod]
  workflow_dispatch:        # Manual trigger from GitHub Actions UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run build
        env:
          # ──────────────────────────────────────────────────────────────
          # Firebase secrets — add these in:
          # GitHub repo → Settings → Secrets and variables → Actions
          #                → New repository secret
          # ──────────────────────────────────────────────────────────────
          PUBLIC_FIREBASE_API_KEY:               ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN:           ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID:            ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET:        ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID:   ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID:                ${{ secrets.PUBLIC_FIREBASE_APP_ID }}

      # GitHub Pages returns 404 for any path that isn't a real file.
      # Copying index.html → 404.html makes GitHub Pages serve our SPA
      # for ALL routes, letting Nuxt's client-side router handle navigation.
      - name: Create SPA 404 fallback
        run: cp .output/public/index.html .output/public/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
